<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas — Catalogue d'outillage technique</title>
    <script>
      // Mirrors the storage key and stored-or-system logic in
      // src/shared/theme/themeStorage.ts — keep both in sync (this runs
      // before the bundle loads, so it can't import that module directly).
      (function () {
        var stored = localStorage.getItem('atlas.theme');
        var isDark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
