services:
  api:
    build:
      context: .
      dockerfile: backend/Atlas.Api/Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/atlas.db"
      Cors__FrontendOrigin: ${FRONTEND_ORIGIN:-http://localhost:5173}
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    volumes:
      - atlas-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

  # Opt-in reverse proxy for a real deployment (`docker compose --profile production up -d --build`).
  # Not used by local `docker compose up` — see README "Déploiement" for the full runbook.
  caddy:
    image: caddy:2
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Not `:?` (required) on purpose: that syntax is validated for every
      # service at parse time, even ones gated by an inactive profile, and
      # would break plain local `docker compose up`. Set a real value in
      # .env before running with --profile production.
      DOMAIN: ${DOMAIN:-CHANGE_ME.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  atlas-data:
  caddy-data:
  caddy-config:
